name: Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  quality-gate:

    name: SonarQube Quality Gate

    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
          SONAR_WEB_JAVAOPTS: "-Xmx512m"
          SONAR_CE_JAVAOPTS: "-Xmx512m"
          SONAR_SEARCH_JAVAOPTS: "-Xmx512m"

    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_ADMIN_PASSWORD: TrainingAdmin123
      SONAR_PROJECT_KEY: csv-excel-processor

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # JAVA
      # =========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # =========================================================
      # WAIT FOR SONARQUBE
      # =========================================================

      - name: Wait for SonarQube
        shell: bash
        run: |
          echo "Waiting for SonarQube..."

          for i in $(seq 1 60); do

            STATUS=$(curl -s \
              "${SONAR_HOST_URL}/api/system/status" \
              | jq -r '.status // empty' || true)

            echo "Attempt ${i}/60 - Status: ${STATUS:-DOWN}"

            if [ "${STATUS}" = "UP" ]; then
              echo "SonarQube is ready."
              exit 0
            fi

            sleep 3

          done

          echo "ERROR: SonarQube did not start."
          exit 1


      # =========================================================
      # SONARQUBE AUTHENTICATION
      # =========================================================

      - name: Configure SonarQube
        shell: bash
        run: |
          set -e

          echo "Configuring SonarQube..."

          # Change default password.
          curl -sS \
            -u admin:admin \
            -X POST \
            "${SONAR_HOST_URL}/api/users/change_password" \
            --data-urlencode "login=admin" \
            --data-urlencode "previousPassword=admin" \
            --data-urlencode "password=${SONAR_ADMIN_PASSWORD}" \
            || true

          # Determine working password.
          if curl -sf \
            -u "admin:${SONAR_ADMIN_PASSWORD}" \
            "${SONAR_HOST_URL}/api/authentication/validate" \
            | jq -e '.valid == true' > /dev/null; then

            PASSWORD="${SONAR_ADMIN_PASSWORD}"

          elif curl -sf \
            -u "admin:admin" \
            "${SONAR_HOST_URL}/api/authentication/validate" \
            | jq -e '.valid == true' > /dev/null; then

            PASSWORD="admin"

          else

            echo "ERROR: SonarQube authentication failed."
            exit 1

          fi

          echo "SonarQube authentication successful."


          # Generate temporary token.
          TOKEN_JSON=$(curl -sf \
            -u "admin:${PASSWORD}" \
            -X POST \
            "${SONAR_HOST_URL}/api/user_tokens/generate" \
            --data-urlencode "name=github-actions-${GITHUB_RUN_ID}")

          TOKEN=$(echo "${TOKEN_JSON}" | jq -r '.token // empty')


          if [ -z "${TOKEN}" ]; then
            echo "ERROR: Could not generate SonarQube token."
            exit 1
          fi


          echo "::add-mask::${TOKEN}"

          echo "SONAR_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

          echo "SONAR_ADMIN_AUTH=admin:${PASSWORD}" >> "${GITHUB_ENV}"

          echo "SonarQube token generated."


      # =========================================================
      # TEST
      # =========================================================

      - name: Run tests
        shell: bash
        run: |

          if [ -f "./mvnw" ]; then

            chmod +x ./mvnw

            ./mvnw -B test

          else

            mvn -B test

          fi


      # =========================================================
      # SONAR ANALYSIS
      # =========================================================

      - name: Run SonarQube analysis
        shell: bash
        run: |

          echo "Running SonarQube analysis..."

          SONAR_ARGS=(

            "-Dsonar.host.url=${SONAR_HOST_URL}"

            "-Dsonar.login=${SONAR_TOKEN}"

            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"

            "-Dsonar.projectName=CSV to Excel Processor"

            "-Dsonar.qualitygate.wait=true"

            "-Dsonar.qualitygate.timeout=180"

          )


          if [ -f "./mvnw" ]; then

            chmod +x ./mvnw

            ./mvnw \
              -B \
              verify \
              sonar:sonar \
              "${SONAR_ARGS[@]}"

          else

            mvn \
              -B \
              verify \
              sonar:sonar \
              "${SONAR_ARGS[@]}"

          fi


      # =========================================================
      # GET QUALITY GATE RESULT
      # =========================================================

      - name: Get quality gate result
        if: always()
        shell: bash
        run: |

          mkdir -p sonar-report

          echo "Getting SonarQube quality gate..."

          curl -sS \
            -u "${SONAR_ADMIN_AUTH}" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}" \
            > sonar-report/quality-gate.json || true

          echo
          echo "Quality Gate Result:"
          cat sonar-report/quality-gate.json || true


      # =========================================================
      # UPLOAD REPORT
      # =========================================================

      - name: Upload SonarQube report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-quality-gate-report
          path: sonar-report/
          if-no-files-found: warn