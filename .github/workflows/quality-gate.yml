name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    name: SonarQube quality gate
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
          SONAR_WEB_JAVAOPTS: -Xmx512m
          SONAR_CE_JAVAOPTS: -Xmx512m
          SONAR_SEARCH_JAVAOPTS: -Xmx512m
    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_ADMIN_PASSWORD: TrainingAdmin123
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube at ${SONAR_HOST_URL}..."
          for i in $(seq 1 90); do
            status=$(curl -sf "${SONAR_HOST_URL}/api/system/status" | jq -r '.status // empty' || true)
            echo "attempt=${i} status=${status:-DOWN}"
            if [ "${status}" = "UP" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time"
          exit 1

      - name: Bootstrap SonarQube token and failing quality gate
        id: sonar
        run: |
          set -euo pipefail

          curl -sf -u admin:admin -X POST \
            "${SONAR_HOST_URL}/api/users/change_password?login=admin&previousPassword=admin&password=${SONAR_ADMIN_PASSWORD}"

          TOKEN=$(curl -sf -u "admin:${SONAR_ADMIN_PASSWORD}" -X POST \
            "${SONAR_HOST_URL}/api/user_tokens/generate?name=github-actions" | jq -r '.token')
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "Failed to generate a SonarQube token"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

          curl -sf -u "admin:${SONAR_ADMIN_PASSWORD}" -X POST \
            "${SONAR_HOST_URL}/api/qualitygates/create?name=workshop-fail"

          # Overall-code conditions so the first analysis of this intentional baseline fails.
          create_condition() {
            curl -sf -u "admin:${SONAR_ADMIN_PASSWORD}" -X POST \
              "${SONAR_HOST_URL}/api/qualitygates/create_condition?gateName=workshop-fail&metric=${1}&op=${2}&error=${3}"
          }
          create_condition bugs GT 0
          create_condition vulnerabilities GT 0
          create_condition code_smells GT 0
          create_condition coverage LT 80

          curl -sf -u "admin:${SONAR_ADMIN_PASSWORD}" -X POST \
            "${SONAR_HOST_URL}/api/qualitygates/set_as_default?name=workshop-fail"

      - name: Run tests, coverage, and Sonar analysis
        run: |
          chmod +x mvnw
          ./mvnw -B verify sonar:sonar \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${{ steps.sonar.outputs.token }}" \
            -Dsonar.projectKey=csv-excel-processor \
            -Dsonar.projectName="CSV to Excel Processor (Coding Standards Demo)" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
