name: Quality Gate

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:


jobs:
  quality-gate:

    name: SonarQube Quality Gate

    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:lts-community

        ports:
          - 9000:9000

        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
          SONAR_WEB_JAVAOPTS: "-Xmx512m"
          SONAR_CE_JAVAOPTS: "-Xmx512m"
          SONAR_SEARCH_JAVAOPTS: "-Xmx512m"


    env:
      SONAR_HOST_URL: http://localhost:9000
      SONAR_ADMIN_PASSWORD: TrainingAdmin123
      SONAR_PROJECT_KEY: csv-excel-processor


    steps:

      # ---------------------------------------------------------
      # 1. Checkout source code
      # ---------------------------------------------------------

      - name: Check out source code
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ---------------------------------------------------------
      # 2. Setup Java
      # ---------------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"
          cache: maven


      # ---------------------------------------------------------
      # 3. Verify project structure
      # ---------------------------------------------------------

      - name: Verify Maven project
        run: |
          echo "Current directory:"
          pwd

          echo
          echo "Repository contents:"
          ls -la

          echo
          echo "Checking pom.xml..."

          if [ ! -f "pom.xml" ]; then
            echo "ERROR: pom.xml was not found."
            exit 1
          fi

          echo "pom.xml found."

          echo
          echo "Checking Maven Wrapper..."

          if [ -f "./mvnw" ]; then
            echo "Maven Wrapper found."
          else
            echo "WARNING: mvnw was not found."
            echo "The workflow will use system Maven."
          fi


      # ---------------------------------------------------------
      # 4. Wait for SonarQube
      # ---------------------------------------------------------

      - name: Wait for SonarQube
        shell: bash

        run: |
          set -e

          echo "Waiting for SonarQube..."
          echo "URL: ${SONAR_HOST_URL}"

          for i in $(seq 1 90); do

            STATUS=$(curl -s \
              "${SONAR_HOST_URL}/api/system/status" \
              | jq -r '.status // empty' || true)

            echo "Attempt ${i}/90 - SonarQube status: ${STATUS:-DOWN}"

            if [ "${STATUS}" = "UP" ]; then
              echo "SonarQube is ready."
              exit 0
            fi

            sleep 5

          done

          echo
          echo "ERROR: SonarQube did not become ready within the timeout."

          echo
          echo "Checking SonarQube endpoint:"
          curl -v "${SONAR_HOST_URL}/api/system/status" || true

          exit 1


      # ---------------------------------------------------------
      # 5. Bootstrap SonarQube authentication
      # ---------------------------------------------------------

      - name: Configure SonarQube authentication
        shell: bash

        run: |
          set -euo pipefail

          echo "Configuring SonarQube authentication..."

          SONAR_ADMIN_PASSWORD="${SONAR_ADMIN_PASSWORD}"

          echo
          echo "Attempting to change default admin password..."

          HTTP_STATUS=$(
            curl -sS \
              -o /tmp/sonar-change-password.json \
              -w "%{http_code}" \
              -u "admin:admin" \
              -X POST \
              "${SONAR_HOST_URL}/api/users/change_password" \
              --data-urlencode "login=admin" \
              --data-urlencode "previousPassword=admin" \
              --data-urlencode "password=${SONAR_ADMIN_PASSWORD}" \
              || true
          )

          echo "Password change HTTP status: ${HTTP_STATUS}"

          # -----------------------------------------------------
          # Determine working admin password
          # -----------------------------------------------------

          echo
          echo "Testing new admin password..."

          if curl -sf \
            -u "admin:${SONAR_ADMIN_PASSWORD}" \
            "${SONAR_HOST_URL}/api/authentication/validate" \
            | jq -e '.valid == true' >/dev/null; then

            echo "New admin password is valid."

            ADMIN_PASSWORD="${SONAR_ADMIN_PASSWORD}"

          elif curl -sf \
            -u "admin:admin" \
            "${SONAR_HOST_URL}/api/authentication/validate" \
            | jq -e '.valid == true' >/dev/null; then

            echo "Default admin password is still active."

            ADMIN_PASSWORD="admin"

          else

            echo "ERROR: Could not authenticate to SonarQube."
            exit 1

          fi


          # -----------------------------------------------------
          # Generate temporary token
          # -----------------------------------------------------

          echo
          echo "Generating temporary SonarQube token..."

          TOKEN_RESPONSE=$(
            curl -sf \
              -u "admin:${ADMIN_PASSWORD}" \
              -X POST \
              "${SONAR_HOST_URL}/api/user_tokens/generate" \
              --data-urlencode "name=github-actions-${GITHUB_RUN_ID}"
          )

          SONAR_TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.token // empty')

          if [ -z "${SONAR_TOKEN}" ]; then

            echo "WARNING: Token generation failed."
            echo "Falling back to admin username/password."

            echo "SONAR_LOGIN=admin" >> "${GITHUB_ENV}"
            echo "SONAR_PASSWORD=${ADMIN_PASSWORD}" >> "${GITHUB_ENV}"

            SONAR_CURL_AUTH="admin:${ADMIN_PASSWORD}"

          else

            echo "::add-mask::${SONAR_TOKEN}"

            echo "SonarQube token generated successfully."

            echo "SONAR_LOGIN=${SONAR_TOKEN}" >> "${GITHUB_ENV}"
            echo "SONAR_PASSWORD=" >> "${GITHUB_ENV}"

            SONAR_CURL_AUTH="${SONAR_TOKEN}:"

          fi


          # -----------------------------------------------------
          # Store curl authentication
          # -----------------------------------------------------

          echo "::add-mask::${SONAR_CURL_AUTH}"

          echo "SONAR_CURL_AUTH=${SONAR_CURL_AUTH}" >> "${GITHUB_ENV}"

          echo
          echo "SonarQube authentication configured successfully."


      # ---------------------------------------------------------
      # 6. Create unique failing quality gate
      # ---------------------------------------------------------

      - name: Create SonarQube quality gate
        shell: bash

        run: |
          set -euo pipefail

          GATE_NAME="workshop-fail-${GITHUB_RUN_ID}"

          echo "Creating quality gate:"
          echo "${GATE_NAME}"

          # -----------------------------------------------------
          # Create quality gate
          # -----------------------------------------------------

          CREATE_RESPONSE=$(
            curl -sS \
              -u "${SONAR_CURL_AUTH}" \
              -X POST \
              "${SONAR_HOST_URL}/api/qualitygates/create" \
              --data-urlencode "name=${GATE_NAME}"
          )

          echo "${CREATE_RESPONSE}"


          # -----------------------------------------------------
          # Helper function
          # -----------------------------------------------------

          create_condition() {

            METRIC="$1"
            OPERATOR="$2"
            ERROR_THRESHOLD="$3"

            echo
            echo "Creating condition:"
            echo "Metric: ${METRIC}"
            echo "Operator: ${OPERATOR}"
            echo "Threshold: ${ERROR_THRESHOLD}"

            RESPONSE=$(
              curl -sS \
                -u "${SONAR_CURL_AUTH}" \
                -X POST \
                "${SONAR_HOST_URL}/api/qualitygates/create_condition" \
                --data-urlencode "gateName=${GATE_NAME}" \
                --data-urlencode "metric=${METRIC}" \
                --data-urlencode "op=${OPERATOR}" \
                --data-urlencode "error=${ERROR_THRESHOLD}"
            )

            echo "${RESPONSE}"

          }


          # -----------------------------------------------------
          # Quality gate rules
          # -----------------------------------------------------

          create_condition "bugs" "GT" "0"

          create_condition "vulnerabilities" "GT" "0"

          create_condition "code_smells" "GT" "0"

          create_condition "coverage" "LT" "80"


          # -----------------------------------------------------
          # Make this gate default
          # -----------------------------------------------------

          echo
          echo "Setting quality gate as default..."

          curl -sf \
            -u "${SONAR_CURL_AUTH}" \
            -X POST \
            "${SONAR_HOST_URL}/api/qualitygates/set_as_default" \
            --data-urlencode "name=${GATE_NAME}"

          echo
          echo "Quality gate created successfully."

          echo "SONAR_GATE_NAME=${GATE_NAME}" >> "${GITHUB_ENV}"


      # ---------------------------------------------------------
      # 7. Run Maven tests
      # ---------------------------------------------------------

      - name: Run Maven tests
        shell: bash

        run: |
          set -e

          echo "Running Maven tests..."

          if [ -f "./mvnw" ]; then

            chmod +x ./mvnw

            ./mvnw -B test

          else

            mvn -B test

          fi


      # ---------------------------------------------------------
      # 8. Run Maven verification and Sonar analysis
      # ---------------------------------------------------------

      - name: Run SonarQube analysis
        id: scan
        shell: bash

        run: |
          set -euo pipefail

          echo "Starting SonarQube analysis..."

          echo
          echo "Project Key:"
          echo "${SONAR_PROJECT_KEY}"

          echo
          echo "SonarQube URL:"
          echo "${SONAR_HOST_URL}"

          SONAR_ARGS=(

            "-Dsonar.host.url=${SONAR_HOST_URL}"

            "-Dsonar.login=${SONAR_LOGIN}"

            "-Dsonar.projectKey=${SONAR_PROJECT_KEY}"

            "-Dsonar.projectName=CSV to Excel Processor (Coding Standards Demo)"

            "-Dsonar.qualitygate.wait=true"

            "-Dsonar.qualitygate.timeout=300"

          )


          if [ -n "${SONAR_PASSWORD:-}" ]; then

            SONAR_ARGS+=(
              "-Dsonar.password=${SONAR_PASSWORD}"
            )

          fi


          echo
          echo "Running Maven verification and Sonar analysis..."


          if [ -f "./mvnw" ]; then

            chmod +x ./mvnw

            ./mvnw \
              -B \
              verify \
              sonar:sonar \
              "${SONAR_ARGS[@]}"

          else

            mvn \
              -B \
              verify \
              sonar:sonar \
              "${SONAR_ARGS[@]}"

          fi


      # ---------------------------------------------------------
      # 9. Export SonarQube report
      # ---------------------------------------------------------

      - name: Export SonarQube report
        if: always()
        shell: bash

        run: |
          set +e

          mkdir -p sonar-report

          echo "Generating SonarQube report..."

          AUTH="${SONAR_CURL_AUTH:-admin:${SONAR_ADMIN_PASSWORD}}"

          PROJECT_KEY="${SONAR_PROJECT_KEY}"


          # -----------------------------------------------------
          # Quality gate status
          # -----------------------------------------------------

          echo
          echo "Downloading quality gate status..."

          curl -sS \
            -u "${AUTH}" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" \
            > sonar-report/quality-gate.json

          if [ ! -s sonar-report/quality-gate.json ]; then

            echo '{}' > sonar-report/quality-gate.json

          fi


          # -----------------------------------------------------
          # Measures
          # -----------------------------------------------------

          echo
          echo "Downloading project measures..."

          curl -sS \
            -u "${AUTH}" \
            "${SONAR_HOST_URL}/api/measures/component?component=${PROJECT_KEY}&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc,security_hotspots,sqale_index,reliability_rating,security_rating,sqale_rating" \
            > sonar-report/measures.json

          if [ ! -s sonar-report/measures.json ]; then

            echo '{}' > sonar-report/measures.json

          fi


          # -----------------------------------------------------
          # Issues
          # -----------------------------------------------------

          echo
          echo "Downloading issues..."

          curl -sS \
            -u "${AUTH}" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${PROJECT_KEY}&ps=500" \
            > sonar-report/issues.json

          if [ ! -s sonar-report/issues.json ]; then

            echo '{}' > sonar-report/issues.json

          fi


          # -----------------------------------------------------
          # Generate Markdown report
          # -----------------------------------------------------

          python3 <<'PY'

          import json
          from pathlib import Path


          report = Path("sonar-report")


          def read_json(filename):

              try:

                  return json.loads(
                      (report / filename).read_text(
                          encoding="utf-8"
                      )
                  )

              except Exception:

                  return {}


          qg = read_json("quality-gate.json")

          measures_raw = read_json("measures.json")

          issues_raw = read_json("issues.json")


          # -----------------------------------------------------
          # Quality gate status
          # -----------------------------------------------------

          project_status = qg.get(
              "projectStatus",
              {}
          )

          status = project_status.get(
              "status",
              "UNKNOWN"
          )


          conditions = project_status.get(
              "conditions",
              []
          )


          # -----------------------------------------------------
          # Measures
          # -----------------------------------------------------

          measures = {

              m.get("metric"): m.get("value", "")

              for m in measures_raw
                  .get("component", {})
                  .get("measures", [])

          }


          # -----------------------------------------------------
          # Issues
          # -----------------------------------------------------

          issues = issues_raw.get(
              "issues",
              []
          )


          # -----------------------------------------------------
          # Markdown
          # -----------------------------------------------------

          lines = [

              "# SonarQube Quality Gate Report",

              "",

              f"**Project:** {PROJECT_KEY}",

              f"**Status:** {status}",

              "",

              "SonarQube runs inside the GitHub Actions runner.",

              "The localhost dashboard is therefore not directly accessible from your computer.",

              "",

              "## Measures",

              "",

              "| Metric | Value |",

              "| --- | --- |",

          ]


          for key in [

              "bugs",

              "vulnerabilities",

              "security_hotspots",

              "code_smells",

              "coverage",

              "duplicated_lines_density",

              "ncloc",

          ]:

              lines.append(

                  f"| {key} | {measures.get(key, 'n/a')} |"

              )


          lines += [

              "",

              "## Quality Gate Conditions",

              "",

              "| Metric | Operator | Threshold | Actual | Status |",

              "| --- | --- | --- | --- | --- |",

          ]


          for condition in conditions:

              lines.append(

                  "| "
                  f"{condition.get('metric', '')} | "
                  f"{condition.get('comparator', '')} | "
                  f"{condition.get('errorThreshold', '')} | "
                  f"{condition.get('actualValue', '')} | "
                  f"{condition.get('status', '')} |"

              )


          lines += [

              "",

              f"## Issues ({len(issues)})",

              "",

              "| Severity | Type | File | Line | Message |",

              "| --- | --- | --- | --- | --- |",

          ]


          for issue in issues:

              component = issue.get(
                  "component",
                  ""
              ).split(":", 1)[-1]


              line = issue.get(
                  "line",
                  ""
              )


              message = str(
                  issue.get(
                      "message",
                      ""
                  )
              )


              message = (
                  message
                  .replace("|", "\\|")
                  .replace("\n", " ")
              )


              lines.append(

                  "| "
                  f"{issue.get('severity', '')} | "
                  f"{issue.get('type', '')} | "
                  f"{component} | "
                  f"{line} | "
                  f"{message} |"

              )


          (
              report / "quality-gate-report.md"
          ).write_text(

              "\n".join(lines) + "\n",

              encoding="utf-8"

          )


          print(
              "SonarQube Markdown report created."
          )

          PY


          echo
          echo "SonarQube report files:"
          find sonar-report -maxdepth 1 -type f -print


      # ---------------------------------------------------------
      # 10. Upload report artifact
      # ---------------------------------------------------------

      - name: Upload SonarQube report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: sonar-quality-gate-report

          path: sonar-report/

          if-no-files-found: warn


      # ---------------------------------------------------------
      # 11. Final quality gate check
      # ---------------------------------------------------------

      - name: Check final quality gate result
        if: always()
        shell: bash

        run: |
          echo "Checking final workflow status..."

          if [ "${{ steps.scan.outcome }}" != "success" ]; then

            echo
            echo "=========================================="
            echo "SONARQUBE QUALITY GATE: FAILED"
            echo "=========================================="

            echo
            echo "The Maven/Sonar analysis failed."

            echo
            echo "Download the artifact:"
            echo "sonar-quality-gate-report"

            exit 1

          fi


          echo
          echo "=========================================="
          echo "SONARQUBE ANALYSIS COMPLETED"
          echo "=========================================="

          echo
          echo "The quality-gate result is available in:"
          echo "sonar-quality-gate-report"
